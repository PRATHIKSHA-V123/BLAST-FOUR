<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blast Four</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">
  <header>
    <div class="logo">Blast Four</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="game.html">Play</a>
      <a href="compare.html">Scores</a>
      <a href="settings.html">Settings</a>
      <button class="btn" id="musicBtn"></button>
      <button class="btn" id="soundBtn"></button>
    </nav>
  </header>
  <main>
    <section id="setup">
      <h2>Choose how to play</h2>
      <div class="bar">
        <button class="btn mode" data-mode="ai">🤖 Player vs AI</button>
        <button class="btn mode" data-mode="2p">👥 Player 1 vs Player 2</button>
        <button class="btn mode" data-mode="daily">📅 Daily Challenge</button>
      </div>
      <p class="sub" id="dailyInfo" hidden></p>
      <div class="form">
        <label>Player 1 name <input type="text" id="name1" maxlength="12" placeholder="Your name"></label>
        <label id="name2Row">Player 2 name <input type="text" id="name2" maxlength="12" placeholder="Friend's name"></label>
        <label>Player 1 colour <input type="color" id="color1" value="#ff2d55"></label>
        <label><span id="label2">AI colour</span> <input type="color" id="color2" value="#ffd000"></label>
        <label id="levelRow">AI level
          <select id="level">
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
          </select>
        </label>
        <label id="firstRow">Who starts? <select id="first"></select></label>
      </div>
      <p class="error" id="setupError"></p>
      <button class="btn big" id="start">▶ Start game</button>
    </section>

    <section id="game" hidden>
      <div class="bar"><div class="pill" id="p1"></div><div class="pill" id="p2"></div></div>
      <div id="msg"></div>
      <div class="board" id="board"></div>
      <div class="bar">
        <button class="btn" id="undo">Undo</button>
        <button class="btn" id="redo">Redo</button>
        <button class="btn" id="newGame">New game</button>
      </div>
    </section>

    <div class="modal" id="modal">
      <div class="box">
        <h1 id="resultTitle" style="font-size:42px"></h1>
        <p class="sub" id="resultText"></p>
        <button class="btn big" id="rematch">Rematch</button>
        <button class="btn big" id="newPlayers">New players</button>
      </div>
    </div>
  </main>
  <script src="engine.js"></script>
  <script src="storage.js"></script>
  <script src="background.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
